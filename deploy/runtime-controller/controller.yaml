# Runtime controller: namespaced RBAC + Deployment. Apply into the namespace
# that will hold the Sandboxes (kubectl -n <ns> apply -f controller.yaml), after
# creating the `runtime-controller` Secret (see README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-controller
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runtime-controller}
subjects:
  - {kind: ServiceAccount, name: runtime-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-controller
spec:
  replicas: 2   # leader election: one reconciles, the other takes over
  selector: {matchLabels: {app: runtime-controller}}
  template:
    metadata: {labels: {app: runtime-controller}}
    spec:
      serviceAccountName: runtime-controller
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: multica-runtime-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTROLLER_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: MULTICA_SERVER_URL, value: "http://server:8080"}
            - name: MULTICA_CONTROLLER_SECRET
              valueFrom: {secretKeyRef: {name: runtime-controller, key: controller-secret}}
            - {name: SANDBOX_IMAGE, value: "multica-daemon:latest"}
            # Optional: per-Sandbox LiteLLM keys (Plan A in CHANGE-PLAN.md section 7).
            # - {name: LITELLM_URL, value: "http://litellm:4000"}
            # - name: LITELLM_ADMIN_KEY
            #   valueFrom: {secretKeyRef: {name: runtime-controller, key: litellm-admin-key}}
            # - {name: LITELLM_MODELS, value: "claude-sonnet,gpt-5"}
            # - {name: LITELLM_MAX_BUDGET, value: "20"}
            # - {name: LITELLM_RPM, value: "120"}
            # - {name: SANDBOX_RUNTIME_CLASS, value: "gvisor"}
          ports: [{name: health, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
