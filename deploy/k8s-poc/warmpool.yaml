apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: {name: daemon-tpl, namespace: mr-poc}
spec:
  envVarsInjectionPolicy: Overrides
  podTemplate:
    spec:
      containers:
        - name: daemon
          image: mr-poc/daemon:v0.6.1
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args: ["echo started=$(date +%s.%N) daemon_id=$MULTICA_DAEMON_ID; sleep 3600"]
          env:
            - {name: MULTICA_DAEMON_ID, value: unset-in-template}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: {name: daemon-pool, namespace: mr-poc}
spec:
  replicas: 2
  sandboxTemplateRef: {name: daemon-tpl}
