apiVersion: v1
kind: Namespace
metadata:
  name: mr-poc
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: mr-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - {name: POSTGRES_DB, value: multica}
            - {name: POSTGRES_USER, value: multica}
            - {name: POSTGRES_PASSWORD, value: multica}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, multica, -d, multica]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mr-poc}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: server, namespace: mr-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: server}}
  template:
    metadata: {labels: {app: server}}
    spec:
      containers:
        - name: server
          image: mr-poc/multica:v0.6.1
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: "postgres://multica:multica@postgres:5432/multica?sslmode=disable"}
            - {name: JWT_SECRET, value: poc-secret-poc-secret-poc-secret-0123}
            - {name: PORT, value: "8080"}
            - {name: MULTICA_DEV_VERIFICATION_CODE, value: "888888"}
            - {name: FRONTEND_ORIGIN, value: "http://localhost:3000"}
            - {name: MULTICA_APP_URL, value: "http://localhost:3000"}
            - {name: MULTICA_PUBLIC_URL, value: "http://server.mr-poc:8080"}
            - {name: ALLOW_SIGNUP, value: "true"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: mr-poc}
spec:
  selector: {app: server}
  ports: [{port: 8080}]
