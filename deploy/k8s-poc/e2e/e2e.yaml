apiVersion: v1
kind: Namespace
metadata: {name: mr-e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: mr-e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          imagePullPolicy: Never
          env:
            - {name: POSTGRES_DB, value: multica}
            - {name: POSTGRES_USER, value: multica}
            - {name: POSTGRES_PASSWORD, value: multica}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, multica, -d, multica]}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mr-e2e}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: v1
kind: Secret
metadata: {name: runtime-controller, namespace: mr-e2e}
stringData:
  controller-secret: e2e-controller-secret-0123456789
  litellm-admin-key: e2e-litellm-admin
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: server, namespace: mr-e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: server}}
  template:
    metadata: {labels: {app: server}}
    spec:
      containers:
        - name: server
          image: mr-e2e/multica:test
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: "postgres://multica:multica@postgres:5432/multica?sslmode=disable"}
            - {name: JWT_SECRET, value: e2e-secret-e2e-secret-e2e-secret-0123}
            - {name: PORT, value: "8080"}
            - {name: MULTICA_DEV_VERIFICATION_CODE, value: "888888"}
            - {name: FRONTEND_ORIGIN, value: "http://localhost:3000"}
            - {name: MULTICA_APP_URL, value: "http://localhost:3000"}
            - {name: MULTICA_PUBLIC_URL, value: "http://server.mr-e2e:8080"}
            - {name: ALLOW_SIGNUP, value: "true"}
            - {name: PLATFORM_ADMIN_EMAILS, value: "ops@e2e.test"}
            - name: MULTICA_CONTROLLER_SECRET
              valueFrom: {secretKeyRef: {name: runtime-controller, key: controller-secret}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: mr-e2e}
spec: {selector: {app: server}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: litellm, namespace: mr-e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      containers:
        - name: litellm
          image: mr-e2e/fake-litellm:test
          imagePullPolicy: Never
          env: [{name: ADMIN_KEY, value: e2e-litellm-admin}]
          ports: [{containerPort: 4000}]
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: mr-e2e}
spec: {selector: {app: litellm}, ports: [{port: 4000}]}
