# The pod pool on a Docker host with one container per pod: the replacement
# for gen-pods.sh. Run it together with stack.yaml and size the pool with
# --scale (keep POOL_SIZE in sandbox.env the same):
#
#   docker compose --env-file sandbox.env -f stack.yaml -f pool-single.yaml \
#     up -d --scale pod=4
#
# Every replica has its own network namespace and IP (the manager identifies a
# pod by it) and its own anonymous volumes and tmpfs, so no pause container,
# shared volume or generated file is needed. One user (1001:2000) runs the
# supervisor, the daemon and the agents; see "Single container" in POOL.md for
# what that costs.
services:
  pod:
    image: ${POOL_IMAGE:-multica-sandbox-pool:0.7.0}
    user: "1001:2000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: always
    environment:
      POD_ROLE: single
      POD_POLL_INTERVAL: 2s
      POD_SHM_DIR: /dev/shm
    networks: [pods]
    # Anonymous volumes keep the image's ownership (1001:2000) and are removed
    # with the container (docker compose down -v). tmpfs keeps task data off
    # the host's disk; it counts against the memory limit.
    volumes:
      - /work
      - /home/pod
    tmpfs:
      - /tmp:size=4g,uid=1001,gid=2000,mode=0770
      - /dev/shm:size=1g,uid=1001,gid=2000,mode=0770
    deploy: {resources: {limits: {cpus: "4", memory: 8G}}}
