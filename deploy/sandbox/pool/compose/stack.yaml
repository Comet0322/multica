# The pool manager and the git gateway for a plain Docker host (a VM without
# Kubernetes), the counterpart of pool/k8s/manager.yaml and git-gateway.yaml.
# The pods come from pool.yaml; run both files together (see README.md):
#
#   docker compose --env-file sandbox.env -f stack.yaml -f pool.yaml up -d --scale pod=4
#
# The network aliases are the in-cluster names the pool image has baked in
# (Dockerfile.pool ARGs), so the same image runs here unchanged.
name: multica-sandbox

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  manager:
    <<: *hardening
    image: ${MANAGER_IMAGE:-multica-sandbox-manager:0.7.0}
    user: "65532:65532"
    environment:
      SANDBOX_MANAGER_LISTEN: ":8080"
      SANDBOX_POOL_ADMIN_LISTEN: "127.0.0.1:8791" # inside the container only: docker compose exec manager wget -qO- http://127.0.0.1:8791/v1/inventory
      # Only the control network, never the pods' network: the endpoints are
      # unauthenticated (Kubernetes keeps pods out with a NetworkPolicy).
      SANDBOX_POOL_GATEWAY_LISTEN: "${CONTROL_MANAGER_IP:-10.99.0.2}:8792"
      SANDBOX_POOL_SIZE: "${POOL_SIZE:-4}"
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:?}
      SANDBOX_POOL_TOKEN_FILE: ${SECRETS_MOUNT:-/run/secrets}/pool-token
      SANDBOX_AUDIT_FILE: "-"
      SANDBOX_LITELLM_URL: ${LITELLM_URL:?}
      SANDBOX_LITELLM_POD_URL: ${LITELLM_POD_URL:-${LITELLM_URL}}
      SANDBOX_LITELLM_MASTER_KEY_FILE: /run/secrets/litellm-master-key
      SANDBOX_LITELLM_MODELS: ${LITELLM_MODELS:?}
      SANDBOX_PROVIDERS: ${PROVIDERS:-claude,opencode}
      SANDBOX_LITELLM_MAX_BUDGET: "${LITELLM_MAX_BUDGET:-5}"
      SANDBOX_LITELLM_RPM_LIMIT: "${LITELLM_RPM_LIMIT:-60}"
      SANDBOX_GIT_GATEWAY_URL: http://git-gateway.multica-sandbox.svc.cluster.local:8081
      SANDBOX_GIT_GATEWAY_MCP_URL: http://git-gateway.multica-sandbox.svc.cluster.local:8081/mcp
    secrets: [pool-token, litellm-master-key]
    networks:
      pods:
        aliases: [sandbox-manager.multica-sandbox.svc.cluster.local]
      control:
        ipv4_address: ${CONTROL_MANAGER_IP:-10.99.0.2}
        aliases: [sandbox-manager-gateway.multica-sandbox.svc.cluster.local]
      egress: {}
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  git-gateway:
    <<: *hardening
    image: ${GATEWAY_IMAGE:-multica-git-gateway:0.7.0}
    user: "65532:65532"
    environment:
      GIT_GATEWAY_LISTEN: ":8081"
      GIT_GATEWAY_GITLAB_URL: ${GITLAB_URL:?}
      GIT_GATEWAY_GITLAB_TOKEN_FILE: ${SECRETS_MOUNT:-/run/secrets}/gitlab-token
      GIT_GATEWAY_VERIFY_URL: http://sandbox-manager-gateway.multica-sandbox.svc.cluster.local:8792/v1/git/verify-token
      GIT_GATEWAY_POD_VERIFY_URL: http://sandbox-manager-gateway.multica-sandbox.svc.cluster.local:8792/v1/git/verify-pod
      GIT_GATEWAY_TASK_URL: ${MULTICA_SERVER_URL}/{workspace_id}/tasks/{task_id}
    secrets: [gitlab-token]
    networks:
      pods:
        aliases: [git-gateway.multica-sandbox.svc.cluster.local]
      control:
        ipv4_address: ${CONTROL_GATEWAY_IP:-10.99.0.3} # fixed: the manager's address must stay free
      egress: {}
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

secrets:
  # Files the operator creates, outside the repository, readable by uid 65532.
  pool-token: {file: "${SECRETS_DIR:-./secrets}/pool-token"}
  litellm-master-key: {file: "${SECRETS_DIR:-./secrets}/litellm-master-key"}
  gitlab-token: {file: "${SECRETS_DIR:-./secrets}/gitlab-token"}

networks:
  # Pods, manager and gateway. Set internal: true to cut the pods off from
  # everything else; then LiteLLM and the package mirror must be reachable on
  # this network too (attach them, or run them on it).
  pods:
    name: multica-sandbox
    internal: ${POD_NETWORK_INTERNAL:-false}
  # Manager and gateway only: the gateway's verification calls.
  control:
    internal: true
    ipam: {config: [{subnet: "${CONTROL_SUBNET:-10.99.0.0/24}"}]}
  # The way out for the manager and the gateway: Multica, LiteLLM, GitLab.
  egress: {}
