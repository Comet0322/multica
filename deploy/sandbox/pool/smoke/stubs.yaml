# Smoke-test stand-ins, deployed OUTSIDE the pool namespace so they play
# "external" services: a fake Multica, a fake LiteLLM and a destination the
# pool must not reach. Not for production.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke-ext
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: multica-upstream, namespace: smoke-ext}
spec:
  replicas: 1
  selector: {matchLabels: {app: multica-upstream}}
  template:
    metadata: {labels: {app: multica-upstream}}
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          command: [python3, -u, /stub/stub.py, upstream, "8000"]
          volumeMounts: [{name: stub, mountPath: /stub}]
      volumes: [{name: stub, configMap: {name: stub}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: litellm, namespace: smoke-ext}
spec:
  replicas: 1
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          command: [python3, -u, /stub/stub.py, litellm, "4000"]
          volumeMounts: [{name: stub, mountPath: /stub}]
      volumes: [{name: stub, configMap: {name: stub}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: other-dest, namespace: smoke-ext}
spec:
  replicas: 1
  selector: {matchLabels: {app: other-dest}}
  template:
    metadata: {labels: {app: other-dest}}
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          command: [python3, -u, /stub/stub.py, other, "80"]
          volumeMounts: [{name: stub, mountPath: /stub}]
      volumes: [{name: stub, configMap: {name: stub}}]
---
apiVersion: v1
kind: Service
metadata: {name: multica-upstream, namespace: smoke-ext}
spec: {selector: {app: multica-upstream}, ports: [{port: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: smoke-ext}
spec: {selector: {app: litellm}, ports: [{port: 4000}]}
---
apiVersion: v1
kind: Service
metadata: {name: other-dest, namespace: smoke-ext}
spec: {selector: {app: other-dest}, ports: [{port: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: package-mirror, namespace: smoke-ext}
spec:
  replicas: 1
  selector: {matchLabels: {app: package-mirror}}
  template:
    metadata: {labels: {app: package-mirror}}
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          command: [python3, -u, /stub/stub.py, other, "80"]
          volumeMounts: [{name: stub, mountPath: /stub}]
      volumes: [{name: stub, configMap: {name: stub}}]
---
apiVersion: v1
kind: Service
metadata: {name: package-mirror, namespace: smoke-ext}
spec: {selector: {app: package-mirror}, ports: [{port: 80}]}
