# Pool membership is enforced here: the manager identifies pods by source IP and
# trusts that only pool pods can reach its pod listener.
# In-cluster services (manager, git gateway) are matched by pod labels, so the
# rules follow the pods. External services keep ipBlock PLACEHOLDERs (set them
# in an overlay): LiteLLM and the package mirror are assumed to run outside
# this namespace, and the git gateway reaches GitLab on its own. If either
# runs in this namespace, replace its ipBlock with a podSelector as for the
# gateway. The DNS rule assumes kube-dns in kube-system.
---
# Pool pods: deny everything, then allow the listed egress. No ingress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pool-pod-egress
  namespace: multica-sandbox
spec:
  podSelector:
    matchLabels:
      multica.io/sandbox-role: pool-pod
  policyTypes: [Ingress, Egress]
  ingress: [] # nothing connects to a pod; reset commands are polled, not pushed
  egress:
    # Manager pod listener only (never the admin or gateway ports).
    - to:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: manager
      ports:
        - {protocol: TCP, port: 8080}
    # Git/MCP gateway (in this namespace)
    - to:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: git-gateway
      ports:
        - {protocol: TCP, port: 8081}
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # LiteLLM (external to this namespace)
    - to:
        - ipBlock: {cidr: 10.0.10.0/24} # PLACEHOLDER
      ports:
        - {protocol: TCP, port: 4000} # PLACEHOLDER
    # Internal package mirror (external to this namespace)
    - to:
        - ipBlock: {cidr: 10.0.12.0/24} # PLACEHOLDER
      ports:
        - {protocol: TCP, port: 80} # PLACEHOLDER
        - {protocol: TCP, port: 443}
---
# Manager: the pod listener accepts only pool pods (the admin listener is
# loopback-bound and not reachable over the network). Egress is left open
# (Multica, LiteLLM); tighten it in an overlay if your CNI allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manager-ingress
  namespace: multica-sandbox
spec:
  podSelector:
    matchLabels:
      multica.io/sandbox-role: manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: pool-pod
      ports:
        - {protocol: TCP, port: 8080}
    # The gateway listener: only the git gateway may ask who a token is. Policies
    # add up, so pool pods still reach 8080 only and the gateway 8792 only.
    - from:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: git-gateway
      ports:
        - {protocol: TCP, port: 8792}
---
# Git gateway: reachable by pool pods only. Its egress (GitLab, the manager's
# gateway listener, DNS) is left open; tighten it in an overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-gateway-ingress
  namespace: multica-sandbox
spec:
  podSelector:
    matchLabels:
      multica.io/sandbox-role: git-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: pool-pod
      ports:
        - {protocol: TCP, port: 8081}
