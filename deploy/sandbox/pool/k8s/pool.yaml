# The pod pool with one container per pod: the alternative to pool.yaml (use
# one of the two; both define Deployment sandbox-pool). pod-supervisor is PID 1
# and runs the Multica daemon, which starts the agent CLIs itself, all as one
# user. A reset kills every process of the pod and empties every writable
# area, so nothing a task leaves behind reaches the next one. What this gives
# up against pool.yaml: the agent can see and ptrace the daemon, and read its
# HOME (see "Single container" in deploy/sandbox/POOL.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-pool
  namespace: multica-sandbox
  labels:
    app.kubernetes.io/name: sandbox-pool
    app.kubernetes.io/part-of: multica-sandbox
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-pool
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: daemon
      labels:
        app.kubernetes.io/name: sandbox-pool
        multica.io/sandbox-role: pool-pod # the label the NetworkPolicies key on
    spec:
      hostNetwork: false # pod identity is the source IP; never share the node's
      automountServiceAccountToken: false # no Kubernetes API access
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: daemon
          image: multica-sandbox-pool:0.7.0 # kustomization.yaml replaces name and tag
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_ROLE
              value: single
            # Reset poll interval; the manager address is baked into the image.
            - name: POD_POLL_INTERVAL
              value: 2s
            # Emptied by the supervisor on every reset.
            - name: POD_SHM_DIR
              value: /dev/shm
          securityContext:
            # No root and no capability (deploy/sandbox/POOL.md).
            runAsUser: 1001
            runAsGroup: 2000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false # no-new-privileges
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
            - {name: home, mountPath: /home/pod}
          # No probe: the supervisor exits, and the kubelet restarts the
          # container, when a reset keeps failing or the manager stops knowing
          # the pod.
      volumes:
        # The only writable areas. Size limits keep one task from filling the node.
        - name: work
          emptyDir: {sizeLimit: 20Gi}
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        # Replaces the runtime's own /dev/shm so the reset can empty it. Counts
        # against the container's memory limit.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: home
          emptyDir: {sizeLimit: 3Gi}
