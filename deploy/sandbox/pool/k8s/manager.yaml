# The pool manager. One replica: the registry is in memory and rebuilt from pod
# re-registration after a restart. It serves two listeners:
#   pod listener   :8080  standard daemon protocol + /pod/control, for pods
#   admin listener :8090  read-only /v1/inventory and /v1/leases, never for pods
# Ports and the config reference are placeholders until the manager's main
# lands; keep them in step with its settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  labels:
    app.kubernetes.io/name: sandbox-manager
    app.kubernetes.io/part-of: multica-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate # never two managers answering for the same pods
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-manager
        multica.io/sandbox-role: manager
    spec:
      hostNetwork: false
      automountServiceAccountToken: false # the manager needs no Kubernetes API
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: multica-sandbox-manager # tag set in kustomization.yaml
          ports:
            - {name: pod, containerPort: 8080}
            - {name: admin, containerPort: 8090}
          env:
            # Workspace PATs and LiteLLM admin credentials live in a Secret the
            # operator creates out of band; only its name is referenced here.
            - name: SANDBOX_MANAGER_CONFIG_FILE # PLACEHOLDER: the manager's real setting name
              value: /etc/sandbox-manager/config.json
          readinessProbe:
            httpGet: {path: /healthz, port: pod}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/sandbox-manager, readOnly: true}
      volumes:
        - name: config
          secret:
            secretName: sandbox-manager-config # created out of band, not in this repo
---
# ClusterIP for pods. It exposes ONLY the pod listener. The admin port is
# deliberately absent here, and the NetworkPolicy also blocks it from pods.
# Admins reach it with `kubectl port-forward deploy/sandbox-manager 8090:8090`
# or an internal-only Service in an overlay.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-manager
  ports:
    - {name: pod, port: 8080, targetPort: pod}
