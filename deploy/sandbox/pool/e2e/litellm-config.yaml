# Real model: claude-haiku-5-5 only. Every name Claude Code may request is an
# alias of it, so no other (dearer) model can be reached. The proxy-wide budget
# caps the whole run; per-task keys carry their own caps (set by the manager).
model_list:
  - model_name: claude-haiku-5-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: claude-opus-5-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: claude-sonnet-5-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: claude-haiku-4-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: claude-sonnet-4-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: claude-opus-4-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
  - model_name: mock-model
    litellm_params: {model: openai/mock, api_key: not-used, mock_response: "mock reply"}

litellm_settings:
  max_budget: 5
  budget_duration: 30d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
