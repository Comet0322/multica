<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>Inside one sandbox pod</title><desc>A pod has a daemon container with the supervisor and the Multica daemon, and an agent-runner container with the runner and the agent CLI, sharing three directories; the supervisor polls the manager.</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#444441}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.zone{fill:none;stroke:#888780;stroke-width:.5}
.dash{stroke-dasharray:5 4}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="440" fill="#FFFFFF"/>
<g class="c-purple"><rect x="250" y="30" width="180" height="56" rx="8"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Sandbox manager</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">/pod/control, task relay</text></g>
<rect class="zone dash" x="40" y="120" width="600" height="276" rx="16"/><text class="th" x="60" y="141">Pod</text>
<rect class="zone" x="60" y="156" width="240" height="178" rx="12"/><text x="76" y="176">Daemon container (uid 1001)</text>
<rect class="zone" x="380" y="156" width="240" height="178" rx="12"/><text x="396" y="176">Agent-runner container (uid 1000)</text>
<g class="c-purple"><rect x="80" y="192" width="200" height="56" rx="8"/><text class="th" x="180" y="211" text-anchor="middle" dominant-baseline="central">Supervisor</text><text class="ts" x="180" y="230" text-anchor="middle" dominant-baseline="central">polls manager, resets pod</text></g>
<g class="c-gray"><rect x="80" y="264" width="200" height="56" rx="8"/><text class="th" x="180" y="283" text-anchor="middle" dominant-baseline="central">Multica daemon</text><text class="ts" x="180" y="302" text-anchor="middle" dominant-baseline="central">stock, polls for tasks</text></g>
<g class="c-purple"><rect x="400" y="192" width="200" height="56" rx="8"/><text class="th" x="500" y="211" text-anchor="middle" dominant-baseline="central">Runner</text><text class="ts" x="500" y="230" text-anchor="middle" dominant-baseline="central">launches agent CLIs</text></g>
<g class="c-gray"><rect x="400" y="264" width="200" height="56" rx="8"/><text class="th" x="500" y="283" text-anchor="middle" dominant-baseline="central">Agent CLI</text><text class="ts" x="500" y="302" text-anchor="middle" dominant-baseline="central">claude, opencode</text></g>
<g class="c-gray"><rect x="60" y="348" width="560" height="32" rx="8"/><text class="ts" x="340" y="364" text-anchor="middle" dominant-baseline="central">Shared: /work, /tmp, /dev/shm</text></g>
<path d="M240 190 L240 58 L248 58" class="arr" marker-end="url(#arrow)"/>
<path d="M282 292 L340 292 L340 220 L398 220" class="arr" marker-end="url(#arrow)"/>
<path d="M500 250 L500 262" class="arr" marker-end="url(#arrow)"/>
<rect class="c-gray" x="40" y="412" width="14" height="14" rx="3"/><text x="62" y="420" dominant-baseline="central">stock</text><rect class="c-purple" x="140" y="412" width="14" height="14" rx="3"/><text x="162" y="420" dominant-baseline="central">added</text>
</svg>
