<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>Sandbox pool architecture overview</title><desc>Multica server talks to the sandbox manager, which uses LiteLLM and the git gateway; pods in the pool talk to the manager, the git gateway and LiteLLM.</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#444441}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.zone{fill:none;stroke:#888780;stroke-width:.5}
.dash{stroke-dasharray:5 4}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="470" fill="#FFFFFF"/>
<g class="c-gray"><rect x="40" y="40" width="170" height="56" rx="8"/><text class="th" x="125" y="59" text-anchor="middle" dominant-baseline="central">Multica server</text><text class="ts" x="125" y="78" text-anchor="middle" dominant-baseline="central">unchanged</text></g>
<g class="c-purple"><rect x="250" y="40" width="180" height="56" rx="8"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Sandbox manager</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">task claim, pod leases</text></g>
<g class="c-gray"><rect x="470" y="40" width="170" height="56" rx="8"/><text class="th" x="555" y="59" text-anchor="middle" dominant-baseline="central">LiteLLM</text><text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">per-task keys</text></g>
<g class="c-purple"><rect x="250" y="170" width="180" height="56" rx="8"/><text class="th" x="340" y="189" text-anchor="middle" dominant-baseline="central">Git gateway</text><text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">git proxy, MR tools</text></g>
<g class="c-gray"><rect x="40" y="170" width="170" height="56" rx="8"/><text class="th" x="125" y="189" text-anchor="middle" dominant-baseline="central">GitLab</text><text class="ts" x="125" y="208" text-anchor="middle" dominant-baseline="central">holds the repos</text></g>
<rect class="zone dash" x="40" y="290" width="600" height="116" rx="16"/><text class="th" x="60" y="312">Sandbox pool (Kubernetes pods)</text>
<g class="c-purple"><rect x="60" y="328" width="170" height="56" rx="8"/><text class="th" x="145" y="347" text-anchor="middle" dominant-baseline="central">Pod 1</text><text class="ts" x="145" y="366" text-anchor="middle" dominant-baseline="central">daemon + agent-runner</text></g>
<g class="c-purple"><rect x="255" y="328" width="170" height="56" rx="8"/><text class="th" x="340" y="347" text-anchor="middle" dominant-baseline="central">Pod 2</text><text class="ts" x="340" y="366" text-anchor="middle" dominant-baseline="central">daemon + agent-runner</text></g>
<g class="c-purple"><rect x="450" y="328" width="170" height="56" rx="8"/><text class="th" x="535" y="347" text-anchor="middle" dominant-baseline="central">Pod N</text><text class="ts" x="535" y="366" text-anchor="middle" dominant-baseline="central">daemon + agent-runner</text></g>
<line x1="212" y1="68" x2="248" y2="68" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M432 68 L468 68" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="98" x2="340" y2="168" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<path d="M248 198 L212 198" class="arr" marker-end="url(#arrow)"/>
<path d="M340 288 L340 228" class="arr" marker-end="url(#arrow)"/>
<path d="M450 288 L450 82 L432 82" class="arr" marker-end="url(#arrow)"/>
<path d="M555 288 L555 98" class="arr" marker-end="url(#arrow)"/>
<rect class="c-gray" x="40" y="432" width="14" height="14" rx="3"/><text x="62" y="440" dominant-baseline="central">existing</text><rect class="c-purple" x="140" y="432" width="14" height="14" rx="3"/><text x="162" y="440" dominant-baseline="central">added</text>
<line x1="230" y1="439" x2="256" y2="439" class="arr" stroke-dasharray="4 3"/><text x="264" y="440" dominant-baseline="central">manager issues git tickets</text>
</svg>
